
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Galeria Privada</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      color: #f5f5f5;
      background: #101114;
    }

    .login-card {
      width: 100%;
      max-width: 390px;
      padding: 35px;
      background: #1b1d22;
      border: 1px solid #33363e;
      border-radius: 18px;
      box-shadow: 0 15px 45px #0005;
    }

    .icon {
      text-align: center;
      font-size: 42px;
      margin-bottom: 12px;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 27px;
    }

    .subtitle {
      text-align: center;
      color: #a9abb4;
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 13px;
      color: white;
      background: #111216;
      border: 1px solid #41444d;
      border-radius: 9px;
      outline: none;
      font-size: 16px;
    }

    input:focus {
      border-color: #70a5ff;
    }

    button {
      width: 100%;
      margin-top: 23px;
      padding: 14px;
      color: white;
      background: #3478f6;
      border: 0;
      border-radius: 9px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #mensagem {
      margin-top: 16px;
      color: #ffaaaa;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
    }

    .footer {
      margin-top: 25px;
      color: #858894;
      text-align: center;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="login-card">
    <div class="icon" aria-hidden="true">🔒</div>

    <h1>Galeria Privada</h1>
    <p class="subtitle">
      Um espaço reservado para suas memórias.
      Entre para continuar.
    </p>

    <form id="formLogin">
      <label for="email">E-mail</label>
      <input
        type="email"
        id="email"
        autocomplete="username"
        placeholder="Seu e-mail"
        required
      >

      <label for="senha">Senha</label>
      <input
        type="password"
        id="senha"
        autocomplete="current-password"
        placeholder="Sua senha"
        required
      >

      <button id="botaoEntrar" type="submit">
        Entrar na galeria
      </button>

      <p id="mensagem" role="status" aria-live="polite"></p>
    </form>

    <div class="footer">
      Acesso restrito • Galeria privada
    </div>
  </main>

  <script type="module">
    import { supabase } from './js/supabase.js';

    const form = document.getElementById('formLogin');
    const botao = document.getElementById('botaoEntrar');
    const mensagem = document.getElementById('mensagem');

    form.addEventListener('submit', async (evento) => {
      evento.preventDefault();

      botao.disabled = true;
      mensagem.textContent = 'Verificando acesso...';

      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;

      try {
        const { error } = await supabase.auth.signInWithPassword({
          email,
          password: senha
        });

        if (error) {
          mensagem.textContent = 'E-mail ou senha inválidos.';
          return;
        }

        window.location.replace('./galeria.html');
      } catch (erro) {
        mensagem.textContent =
          'Não foi possível conectar. Verifique sua internet e tente novamente.';
      } finally {
        botao.disabled = false;
      }
    });
  </script>
</body>
</html>
